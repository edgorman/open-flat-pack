syntax = "proto3";

package app.v1;

option go_package = "github.com/edgorman/webapp-template/services/backend/internal/gen/app/v1;appv1";

// Catalogue is what `GET /catalogue` answers with: every part a design may use. The backend
// embeds the catalogue file and serves it as-is - see docs/design/v1/0002-catalogue.md.
message Catalogue {
  repeated Part parts = 1;
}

// Part is one catalogue entry, keyed by its IKEA article number. An article number identifies
// exactly one version of a product, so an entry never changes meaning. It holds no prices or page
// text: the product page is https://www.ikea.com/gb/en/p/-<article>/.
message Part {
  string article = 1;
  // Range and type, e.g. "KALLAX shelving unit".
  string name = 2;
  // Drives the preview colour, e.g. "white".
  string finish = 3;
  Size size = 4;
  // Slot names this part may sit in or on, e.g. "cube", or "floor" for the built-in floor.
  repeated string rests_on = 5;
  // Slots this part provides to others.
  repeated Slot offers = 6;
}

// Size is a part's bounding box in mm: width and height as seen from the front, and depth.
message Size {
  int32 w = 1;
  int32 h = 2;
  int32 d = 3;
}

// Slot is a named rectangle on a part that other parts rest in or on, in mm relative to the
// part's bottom-left corner, seen from the front.
message Slot {
  // What a resting part lists in its rests_on, e.g. "cube", "top", "base" or "pax_front".
  string name = 1;
  // "cell" (a resting part fills it exactly, one part per cell), "surface" (a resting part sits
  // wholly on it, possibly spanning several at the same height), "front" (resting parts lie wholly
  // inside it, in front of the part, without overlapping each other) or "inside" (the same, within
  // the part) - a plain string rather than an enum, see the "Contract Layer" section of
  // `packages/protos/AGENTS.md`.
  string kind = 2;
  int32 x = 3;
  int32 y = 4;
  int32 w = 5;
  int32 h = 6;
}
